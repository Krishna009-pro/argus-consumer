[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "argus-consumer"
version = "0.1.0"
description = "Evidence-grounded public-data financial discovery for consumer businesses"
requires-python = ">=3.11"
dependencies = ["pydantic>=2,<3", "PyYAML>=6"]

[project.optional-dependencies]
dashboard = ["streamlit>=1.35", "pandas>=2", "altair>=5", "reportlab>=4"]
ingest = ["requests>=2.31", "pypdf>=4", "pdfplumber>=0.11"]
dev = ["pytest>=8"]

[project.scripts]
argus = "argus.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
